<script>
const D = JSON.parse(document.getElementById('D').textContent);
const st = {kind:'restaurant', mode:'a', sort:'s'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '-' : Number(n).toLocaleString('ko-KR');
document.getElementById('sub').textContent = `근거 링크가 있는 곳만 · 확인일 ${D.verified} · 집(미사강변아란티움) 기준`;
document.getElementById('note').innerHTML =
  `동네 식당·카페 <b>${D.places.length}곳</b>을 실제 후기·별점으로 검증했어요 (추천 ${D.counts['추천']} · 조건부 ${D.counts['조건부']} · 근거부족 ${D.counts['근거부족']} · 제외 ${D.counts['제외']}). 지금은 <b>시범판</b>이라 이 동네만 있어요.`;

function go(app, web) {
  const t = Date.now(); location.href = app;
  setTimeout(() => { if (!document.hidden && Date.now() - t < 2600) location.href = web; }, 1300);
}
window.go = go;

function modeB(p) {
  const v = p.bv;
  const cls = v.startsWith('적합') ? 'ok' : v.startsWith('부적합') ? 'no' : 'warn';
  const icon = cls === 'ok' ? '✅' : cls === 'no' ? '⛔' : '❓';
  let h = `<div class="modeb ${cls}"><h4>${icon} 부모님(걷기·앉기) 관점: ${esc(v)}</h4>`;
  const seenL = new Set();
  p.pos.filter(e => !seenL.has(e.l) && seenL.add(e.l)).slice(0, 3).forEach(e => h += `<p class="q">✅ ${esc(e.l)} — “${esc(e.q)}” <span>(${esc(e.k)}${e.d ? ', ' + esc(e.d) : ''})</span></p>`);
  p.neg.slice(0, 2).forEach(e => h += `<p class="q">⚠️ ${esc(e.l)} — “${esc(e.q)}” <span>(${esc(e.k)}${e.d ? ', ' + esc(e.d) : ''})</span></p>`);
  if (p.park.length) h += `<p class="q">🅿️ ${esc(p.park[0])} <span>(카카오 안내)</span></p>`;
  if (p.unk.length) h += `<p class="q">❓ 확인 필요: <b>${esc(p.unk.join(' · '))}</b>${p.tel ? ` — 전화 <a class="tel" href="tel:${esc(p.tel)}">${esc(p.tel)}</a>` : ''}</p>`;
  if (p.soft) h += `<p class="q">🍲 부드러운 음식 메뉴가 있어요</p>`;
  return h + '</div>';
}

function card(p) {
  const rate = [];
  if (p.nr) rate.push(`네이버 ★${p.nr} (${fmt(p.nn)})`);
  if (p.kr) rate.push(`카카오 ★${p.kr} (${fmt(p.kn)})`);
  const pills = [];
  if (p.rp && p.rp >= 4.5) pills.push('<span class="pill g">고평점</span>');
  if (p.rs && !p.rs.startsWith('네이버')) pills.push(`<span class="pill w">별점: ${esc(p.rs)}</span>`);
  // '영업 중/오늘 휴무'는 수집 시점의 스냅샷이라 표시하지 않는다(가는 날 상태는 네이버 지도에서 확인). 폐업 신호만 표시.
  p.flags.filter(f => /웨이팅|폐업/.test(f)).forEach(f => pills.push(`<span class="pill w">${esc(f)}</span>`));
  const kids = st.mode === 'a' && p.kids.length ? `<p class="q">👶 아이 관련 근거: ${esc(p.kids.join(' · '))}</p>` : '';
  const cost = p.cost ? `<span>4인 약 ${fmt(Math.round(p.cost / 1000) * 1000)}원 <small style="color:var(--muted)">(메뉴판 추정)</small></span>` : '';
  const src = [];
  p.blogs.filter(b => !b.sp).forEach(b => src.push(`<li>블로그 <a href="${esc(b.u)}" target="_blank" rel="noopener">${esc((b.t || '').slice(0, 44))}</a> — ${esc(b.a || '')} · ${esc(b.d || '')}</li>`));
  p.yt.forEach(y => src.push(`<li>유튜브 ${y.w === 'comment' ? '댓글' : '설명'} <a href="${esc(y.l)}" target="_blank" rel="noopener">${esc((y.q || '').slice(0, 44))}</a></li>`));
  const menus = p.menus.filter(m => m[0]).map(m => `${esc(m[0])} ${m[1] ? fmt(m[1]) + '원' : ''}`).join(' · ');
  return `<div class="card">
    <div class="top"><div><h3 class="name">${esc(p.n)}</h3><div class="cat">${esc(p.cat)} · ${esc(p.addr || '')}</div></div>
      <div class="badge t-${esc(p.tier)}">${esc(p.tier)}<b>${p.s}</b></div></div>
    <div class="row"><span>🚗 ${p.dr != null ? Math.round(p.dr) + '분' : '-'}</span>${p.wk != null ? `<span>🚶 ${Math.round(p.wk)}분</span>` : ''}${rate.map(r => `<span>${r}</span>`).join('')}${cost}</div>
    <div style="margin-top:6px">${pills.join('')}</div>
    ${st.mode === 'b' ? modeB(p) : kids}
    <div class="btns">
      <a class="btn pri" href="${esc(p.nav.app)}" onclick="go('${esc(p.nav.app)}','${esc(p.nav.web)}');return false;">🧭 네이버 내비 시작</a>
      <a class="btn" href="${esc(p.nav.web)}" target="_blank" rel="noopener">네이버 지도</a>
      ${p.nav.kakao ? `<a class="btn" href="${esc(p.nav.kakao)}" target="_blank" rel="noopener">카카오맵</a>` : ''}
    </div>
    <details><summary>점수 근거·후기 링크</summary>
      <ul><li>평판 ${p.bd.reputation} · 근거 ${p.bd.evidence} · 가족적합 ${p.bd.family_fit} · 실용 ${p.bd.practicality} (합계 ${p.s})</li>
      ${menus ? `<li>메뉴: ${menus}</li>` : ''}
      ${p.tel ? `<li>전화 <a href="tel:${esc(p.tel)}">${esc(p.tel)}</a></li>` : ''}
      ${src.join('')}${st.mode === 'a' ? '' : ''}</ul>
      ${st.mode === 'a' ? modeB(p) : ''}
    </details>
  </div>`;
}

function render() {
  let arr = D.places.filter(p => p.kind === st.kind);
  if (st.mode === 'b') arr = arr.filter(p => !p.bv.startsWith('부적합'));
  const main = arr.filter(p => p.tier === '추천' || p.tier === '조건부');
  const weak = arr.filter(p => p.tier === '근거부족');
  const excl = D.places.filter(p => p.kind === st.kind && p.tier === '제외');
  const key = st.sort === 'dr' ? (a, b) => (a.dr ?? 99) - (b.dr ?? 99) : (a, b) => b.s - a.s;
  main.sort(key); weak.sort(key);
  document.getElementById('list').innerHTML = main.length ? main.map(card).join('') : '<div class="empty">조건에 맞는 곳이 아직 없어요</div>';
  document.getElementById('weakList').innerHTML = weak.map(card).join('') || '<div class="empty">없음</div>';
  document.getElementById('weak').style.display = weak.length ? '' : 'none';
  document.getElementById('exclList').innerHTML = '<ul>' + excl.map(p => `<li><b>${esc(p.n)}</b>: ${esc(p.fails.join(' / '))}</li>`).join('') + '</ul>';
  document.getElementById('excl').style.display = excl.length ? '' : 'none';
}
for (const [id, key] of [['segKind', 'kind'], ['segMode', 'mode']]) {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st[key] = b.dataset.v;
    document.querySelectorAll('#' + id + ' button').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });
}
document.getElementById('sort').addEventListener('change', e => { st.sort = e.target.value; render(); });
render();
</script>
</body>
