name: 주말 가족나들이 자동 갱신 및 카톡 알림

on:
  # 매주 금요일 아침 8시 (한국시간 KST = UTC 목요일 23:00)
  schedule:
    - cron: '0 23 * * 4'
  # GitHub 사이트에서 [Run workflow] 버튼을 눌러 수동 실행도 가능
  workflow_dispatch:

jobs:
  update-trips:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests

      - name: 신규 여행지 자동 수집 및 카톡 알림 발송
        run: |
          python auto_collector.py --test
          # trips_data.json을 trips_data.js로 자동 동기화
          echo "const TRIPS_MASTER_DATA = $(cat trips_data.json);" > trips_data.js

      - name: 변경 사항 자동 커밋 & 푸시
        run: |
          git config --global user.name "TripBot"
          git config --global user.email "tripbot@github.com"
          git add trips_data.json trips_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚗 주말 추천 가족 나들이 자동 업데이트 [$(date '+%Y-%m-%d')]" && git push)
